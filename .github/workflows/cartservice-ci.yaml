name: cartservice-ci

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'src/cartservice/**'
  pull_request:
    paths:
      - 'src/cartservice/**'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('src/cartservice/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
            
      - name: Restore
        run: dotnet restore src/cartservice/src/cartservice.csproj

      - name: Run tests
        run: dotnet test src/cartservice/tests --logger trx

  build-scan-push:
    needs: test
    uses: ./.github/workflows/reusable-build-scan-push.yml
    with:
      service_name: cartservice
      dockerfile_context: src/cartservice/src
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  trigger-azure-test-env:
    needs: build-scan-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: deploy-azure-testenv
    steps:
      - name: Trigger deploy of Azure ephemeral test environment
        run: |
          curl --request POST \
            --form token=${{ secrets.GITLAB_TRIGGER_TOKEN }} \
            --form ref=main \
            "https://gitlab.com/api/v4/projects/86440387/trigger/pipeline"
