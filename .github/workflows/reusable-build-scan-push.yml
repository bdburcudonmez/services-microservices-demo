name: Reusable - Build, Scan, Push

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      dockerfile_context:
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine image tag
        id: set-tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            TAG="pr-${{ github.event.number }}"
          else
            TAG="dev-latest"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.dockerfile_context }}
          load: true
          tags: ${{ inputs.service_name }}:${{ steps.set-tag.outputs.tag }}

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ inputs.service_name }}:${{ steps.set-tag.outputs.tag }}'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          format: 'table'

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push image
        run: |
          docker tag ${{ inputs.service_name }}:${{ steps.set-tag.outputs.tag }} ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.service_name }}:${{ steps.set-tag.outputs.tag }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.service_name }}:${{ steps.set-tag.outputs.tag }}
